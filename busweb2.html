<!DOCTYPE html>
<html>
<head>
  <title>My Business Website</title>
  <style>
    body {
      background: linear-gradient(to right, rgb(92, 40, 40), rgb(175, 119, 119));
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: rgb(100, 77, 35);
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #333;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: yellow;
    }

    .box {
      border: 2px solid black;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      background-color: #f9f9f9;
      box-shadow: 4px 4px 10px gray;
    }

    h1 {
      text-transform: uppercase;
      color: rgb(0, 0, 0);
    }

    h2 {
      text-shadow: 2px 2px 5px rgb(114, 61, 61);
      color: darkred;
    }

    /* Image styling */
    .banner {
      text-align: center;
      margin: 20px 0;
    }

    .banner img {
      width: 80%;        /* makes image responsive */
      max-width: 600px;  /* limit size */
      border: 3px solid rgb(0, 0, 0);
      box-shadow: 4px 4px 10px gray;
    }
 
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cup & Crumble</h1>
    <p>Coffee and Pastry </p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
  </nav>

  <!-- IMAGE SECTION -->
  <div class="banner">
    <img src="asd.jpeg" alt="Business Banner">
    <!-- Replace 'your-image.jpg' with your actual image file -->
  </div>

  <div class="box">
    <h2>Start Your Day!</h2>
    <p>Start your day with the aroma of freshly brewed coffee. Pair it with pastries baked to perfection. Together, they bring comfort and joy to every moment.</p>
  </div>

  <footer>
    &copy; 2025 Cup & Crumble. All rights reserved.
  </footer>
</body>
</html>
